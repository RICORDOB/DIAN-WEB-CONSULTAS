<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d47a1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png" />
  <title>DIAN Web — Consulta</title>
  <link rel="stylesheet" href="/assets/styles.css?v=20260829r2" />
</head>
<body>
  <header class="barra">
    <strong>Consultas DIAN</strong>
    <div>
      <span id="usuarioActual"></span>
      <a href="/panel" class="v-inline">Consulta</a>
      <a href="/dev" class="v-inline oculto" id="linkDev">Panel desarrollador</a>
      <button class="boton-enlace" id="btnSalir">Salir</button>
    </div>
  </header>

  <div class="card panel-ancho">
    <h1>Consulta individual</h1>
    <p class="subtitulo">Ingresa los datos del cliente y presiona CONSULTAR.</p>

    <p class="push-linea">
      <button class="boton boton-mini" id="btnPush" type="button">Activar notificaciones</button>
      <span id="pushEstado" class="subtitulo"></span>
    </p>

    <div id="mensaje" class="mensaje oculto"></div>

    <form id="consultaForm" class="formulario">
      <label for="tipoDocumento">Tipo de documento</label>
      <select id="tipoDocumento">
        <option>Cédula de Ciudadanía</option>
        <option>Cédula de Extranjería</option>
        <option>NIT</option>
        <option>Tarjeta de Identidad</option>
        <option>Pasaporte</option>
        <option>NUIP</option>
      </select>

      <label for="numeroDocumento">Número de cédula / documento</label>
      <input type="text" id="numeroDocumento" required inputmode="numeric" autocomplete="off" />

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" required autocomplete="off" />

      <button type="submit" class="boton" id="btnConsultar">CONSULTAR</button>
    </form>

    <div id="progresoBox" class="oculto">
      <h3>Progreso</h3>
      <div id="estadoJob" class="estado">En cola...</div>
      <pre id="logProgreso" class="log"></pre>
    </div>

    <div id="descargaBox" class="oculto">
      <a href="#" id="linkDescargar" class="boton">DESCARGAR RESULTADO</a>
    </div>
  </div>

  <footer class="pie">Realizada por Ricardo Córdoba y Ana María Rozo, dueños de la firma Contador. A tu servicio.</footer>

  <script src="/assets/app.js?v=20260829r2"></script>
</body>
</html>
