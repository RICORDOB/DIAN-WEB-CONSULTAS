# Despliegue de ExoRenta (DIAN-WEB-CONSULTAS) en un VPS propio (Oracle Cloud ARM).
#
# Uso:
#   cp .env.example .env   # completar secretos
#   docker compose up -d --build
#   docker compose logs -f app
#
# La app NO publica el puerto al mundo: escucha solo en loopback y Caddy
# (TLS automático) hace el proxy desde 80/443.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exorenta:latest
    container_name: exorenta
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8000"
      APP_DATA_DIR: /data
      APP_JOBS_DIR: /data/jobs
      APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - exorenta_data:/data
    # Chrome necesita memoria compartida amplia para no morir en páginas pesadas.
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  exorenta_data:
